<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<title>Look C: Cut-Out Council</title>
<style data-fonts="@fontsource-variable/archivo/wdth.css"></style>
<style>
/* ---------- tokens ---------- */
:root {
  color-scheme: light;
  --page: #FFFFFF;
  --surface: #FFFFFF;
  --table: #DEE5DD;
  --hover: #E6E9E3;
  --border: #D3D8D1;
  --line: #77827B;
  --text: #17201C;
  --muted: #535E58;
  --accent: #1D2A24;
  --accent-hover: #2C3B33;
  --on-accent: #FFFFFF;
  --agreed: #1A6B42;
  --error: #A32A1C;
  --seat-1: #005960;
  --seat-2: #23246E;
  --seat-3: #8C6205;
  --seat-4: #641530;
  --seat-5: #656B78;
  --seat-6: #8A2C06;
  --seat-7: #6C379B;
}
[data-theme=dark] {
  color-scheme: dark;
  --page: #151B18;
  --surface: #1C2420;
  --table: #213029;
  --hover: #242D28;
  --border: #2D3832;
  --line: #74817A;
  --text: #E6EBE7;
  --muted: #9CA9A2;
  --accent: #E6EBE7;
  --accent-hover: #FFFFFF;
  --on-accent: #151B18;
  --agreed: #74C998;
  --error: #F0897A;
  --seat-1: #A1E8E5;
  --seat-2: #789AFF;
  --seat-3: #FAD786;
  --seat-4: #DE6365;
  --seat-5: #ABB6B5;
  --seat-6: #F49A5B;
  --seat-7: #9D85B2;
}
.s1 { --seat: var(--seat-1); } .s2 { --seat: var(--seat-2); } .s3 { --seat: var(--seat-3); }
.s4 { --seat: var(--seat-4); } .s5 { --seat: var(--seat-5); } .s6 { --seat: var(--seat-6); }
.s7 { --seat: var(--seat-7); }

/* corner sizes: 8, 14, fully round. Nothing else. */
:root { --r-small: 8px; --r-large: 14px; --r-round: 999px; }

/* ---------- page ---------- */
* { box-sizing: border-box; }
html { background: var(--page); color: var(--text); }
body {
  margin: 0; width: 1440px; padding-bottom: 48px;
  font: 400 16px/25px 'Archivo Variable';
  font-variant-numeric: lining-nums;
  -webkit-font-smoothing: antialiased;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
.num { font-variant-numeric: lining-nums tabular-nums; }

.study-head { height: 72px; padding: 0 24px; display: flex; align-items: center; justify-content: space-between; }
.study-head h1 { margin: 0; font-size: 24px; line-height: 30px; font-weight: 620; font-stretch: 112%; }
.cap { height: 48px; margin: 0; padding: 0 24px; display: flex; align-items: center; justify-content: space-between; font-size: 14px; line-height: 20px; font-weight: 500; }

/* ---------- controls ---------- */
.btn { height: 36px; padding: 0 14px; border: 1px solid var(--line); border-radius: var(--r-small); background: transparent; font-size: 14px; line-height: 20px; font-weight: 500; }
.btn:hover { background: var(--hover); }
.btn-ink { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn-ink:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn-small { height: 30px; padding: 0 12px; }
.switch { display: inline-flex; padding: 3px; border: 1px solid var(--line); border-radius: var(--r-round); }
.switch button { height: 28px; padding: 0 14px; border: 0; border-radius: var(--r-round); background: transparent; font-size: 14px; line-height: 20px; font-weight: 500; }
.switch button[aria-pressed=true] { background: var(--accent); color: var(--on-accent); }
:is(button, input, .msg):focus-visible, .msg:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
.msg input:focus-visible { outline: none; }

/* ---------- app window: 1440 x 830 ---------- */
.window { position: relative; width: 1440px; height: 830px; overflow: hidden; background: var(--page); outline: 1px solid var(--border); }
.topbar { position: absolute; inset: 0 0 auto 0; height: 48px; padding: 0 16px 0 24px; display: flex; align-items: center; gap: 24px; border-bottom: 1px solid var(--border); }
.tb-title { margin-right: auto; font-size: 15px; line-height: 20px; font-weight: 620; }
.seated { display: flex; gap: 16px; }
.seatname { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; line-height: 20px; font-weight: 500; }
.pill { height: 30px; padding: 0 14px; display: inline-flex; align-items: center; gap: 18px; border: 1px solid var(--line); border-radius: var(--r-round); font-size: 13px; line-height: 20px; font-weight: 550; }
.pill .is-agreed { display: inline-flex; align-items: center; gap: 6px; color: var(--agreed); }

.sidebar { position: absolute; inset: 48px auto 0 0; width: 240px; padding: 16px 12px 12px; display: flex; flex-direction: column; gap: 2px; border-right: 1px solid var(--border); }
.side-item { height: 36px; padding: 0 12px; display: flex; align-items: center; justify-content: space-between; border: 0; border-radius: var(--r-small); background: transparent; text-align: left; font-size: 14px; line-height: 20px; font-weight: 500; }
.side-item[aria-current] { background: var(--hover); font-weight: 650; }
.side-item .val { color: var(--muted); font-weight: 400; }
.side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 2px; }
.side-note { margin: 8px 12px 4px; font-size: 12px; line-height: 16px; color: var(--muted); }
html[data-theme=dark] .when-light, html[data-theme=light] .when-dark { display: none; }

.conv { position: absolute; inset: 48px 0 0 240px; }
.col { position: absolute; left: 280px; top: 24px; width: 640px; }

/* owner's question: plain words, right-aligned, no box */
.ask { text-align: right; }
.ask .q { margin: 0; font-size: 16px; line-height: 25px; font-weight: 500; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.ask .chips { justify-content: flex-end; margin-top: 10px; }
.chip { height: 26px; padding: 0 10px; display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: var(--r-small); font-size: 12px; line-height: 16px; font-weight: 500; white-space: nowrap; }
.chip .more { color: var(--muted); font-weight: 400; }
.meta { font-size: 12px; line-height: 16px; color: var(--muted); }
.ask .meta { margin: 8px 0 0; }

/* ---------- stage: 1040 x 558, flat side of the table at y 520 ---------- */
/* top 170: flat side lands 12 px above the message-box row (dock top 702) */
.stage { position: absolute; left: 80px; top: 170px; width: 1040px; height: 558px; }
.stage svg { position: absolute; inset: 0; overflow: visible; }
svg text { font-family: 'Archivo Variable'; }

.fig { outline: none; cursor: pointer; }
.fig .body, .fig .head { fill: var(--seat); }
.fig .cut { fill: none; stroke: var(--page); }
.fig .gap { fill: var(--page); }
.fig .ring { fill: none; stroke: var(--accent); stroke-width: 3; }
.fig .nm { fill: var(--page); font-weight: 650; text-anchor: middle; }
.fig .focus { fill: none; stroke: var(--accent); stroke-width: 2; visibility: hidden; }
.fig:focus-visible .focus, .fig.show-focus .focus { visibility: visible; }

.vote .v-gap { fill: var(--page); }
.vote .v-solid { fill: var(--accent); }
.vote .v-check { fill: none; stroke: var(--on-accent); stroke-linecap: round; stroke-linejoin: round; }
.vote .v-hollow { fill: var(--page); stroke: var(--accent); }
.vote .v-cross { fill: none; stroke: var(--accent); stroke-linecap: round; }

.cloth { fill: var(--table); }
.cloth-edge { fill: none; stroke: var(--line); stroke-width: 1.5; }
.tc { text-anchor: middle; fill: var(--text); font-variant-numeric: lining-nums tabular-nums; }
.tc-round { font-size: 14px; font-weight: 600; }
.tc-round .time { font-weight: 550; }
.tc-cap { font-size: 13px; font-weight: 450; }
.pip-on { fill: var(--accent); }
.pip-off { fill: none; stroke: var(--line); stroke-width: 1.5; }
.pip-bar { fill: var(--accent); }

/* bubbles: HTML, edge in the line token, no shadow */
.bubble { position: absolute; max-width: var(--bw); width: max-content; padding: 10px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-small); font-size: 13px; line-height: 18px; font-weight: 450; font-stretch: 96%; }
.bubble span { display: block; max-height: 36px; overflow: hidden; text-wrap: balance; }
.bubble::after { content: ""; position: absolute; bottom: -6.5px; left: calc(var(--tail) - 5.5px); width: 11px; height: 11px; background: var(--surface); border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); transform: rotate(45deg); }
.bubble.from-right::after { left: auto; right: calc(var(--tail) - 5.5px); }
.bubble.is-fading { opacity: .5; }

/* Play: gone 400 ms, in 250 ms, stays 8 s, out 1.5 s, then the still picture returns */
@keyframes bubble-life { 0%, 3.59% { opacity: 0; } 5.83%, 77.58% { opacity: 1; } 91.03%, 100% { opacity: 0; } }
@keyframes bubble-step { 0% { opacity: 0; } 4.15% { opacity: 1; } 87.05%, 100% { opacity: 0; } }
.bubble.playing { animation: bubble-life 11150ms linear both; }
@media (prefers-reduced-motion: reduce) {
  .bubble.playing { animation: bubble-step 9650ms steps(1, end) both; }
}

/* message-box row: 12 px under the table's flat side, same centre line */
.dock { position: absolute; left: 80px; top: 702px; width: 1040px; height: 52px; display: flex; align-items: center; justify-content: space-between; }
.dock .left { display: flex; gap: 8px; }
.msg { position: absolute; left: 200px; top: 0; width: 640px; height: 52px; padding: 0 8px 0 18px; display: flex; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-large); }
.msg input { flex: 1; min-width: 0; height: 36px; padding: 0; border: 0; background: transparent; font-size: 16px; }
.msg input::placeholder { color: var(--muted); opacity: 1; }

/* ---------- released answer ---------- */
.folded { margin-top: 28px; padding: 20px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-large); }
.folded-top { display: flex; align-items: flex-start; justify-content: space-between; }
.folded h3 { margin: 0; display: flex; align-items: center; gap: 8px; font-size: 20px; line-height: 26px; font-weight: 650; font-stretch: 106%; }
.folded h3 svg { color: var(--agreed); }
.folded .meta { margin: 2px 0 0; font-size: 13px; line-height: 18px; }
.lineup { margin: 16px 0 0; padding: 0; list-style: none; display: flex; gap: 22px; }
.lineup li { width: 44px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 12px; line-height: 16px; font-weight: 500; }
.answer { margin-top: 28px; }
.answer p { margin: 0 0 14px; max-width: 608px; font-size: 16px; line-height: 26px; }
.cited { margin-top: 20px; }
.answer .dissent { margin: 20px 0 0; padding-top: 16px; border-top: 1px solid var(--border); max-width: none; font-size: 14px; line-height: 22px; }
</style>
</head>
<body>
<header class="study-head">
  <h1>Look C: Cut-Out Council</h1>
  <div class="switch" role="group" aria-label="Theme">
    <button type="button" data-set-theme="light">Light</button>
    <button type="button" data-set-theme="dark">Dark</button>
  </div>
</header>
<main id="panels"></main>

<script>
/* Words, seats and sizes copied from docs/direction/study-content.json. Not changed. */
const C = {
  frame: {
    sidebarItems: ["New chat", "History", "Library", "Models", "Settings"],
    sidebarFooter: ["Theme", "Shortcuts", "Sample data. Invented files and answers."],
    messageBoxPlaceholder: "Add a note for the next round"
  },
  stage: { width: 1040, height: 558, centreX: 520.0, flatEdgeY: 520 },
  layouts: {
    five: { headDiameter: 72, ringRadius: 263, tableRadius: 204, bubbleMaxWidth: 280, seats: [
      { seat: 1, name: "Phi", x: 269.9, bodyBottomY: 438.7 },
      { seat: 2, name: "Llama", x: 365.4, bodyBottomY: 307.2 },
      { seat: 3, name: "Qwen", x: 520.0, bodyBottomY: 257.0 },
      { seat: 4, name: "Gemma", x: 674.6, bodyBottomY: 307.2 },
      { seat: 5, name: "Mistral", x: 770.1, bodyBottomY: 438.7 } ] },
    seven: { headDiameter: 64, ringRadius: 277, tableRadius: 224, bubbleMaxWidth: 240, seats: [
      { seat: 1, name: "Phi", x: 249.9, bodyBottomY: 458.4 },
      { seat: 2, name: "Llama", x: 303.4, bodyBottomY: 347.3 },
      { seat: 3, name: "Granite", x: 399.8, bodyBottomY: 270.4 },
      { seat: 4, name: "Qwen", x: 520.0, bodyBottomY: 243.0 },
      { seat: 5, name: "Gemma", x: 640.2, bodyBottomY: 270.4 },
      { seat: 6, name: "Hermes", x: 736.6, bodyBottomY: 347.3 },
      { seat: 7, name: "Mistral", x: 790.1, bodyBottomY: 458.4 } ] }
  },
  bubble: { lines: 2, gapAboveHead: 12 },
  question: {
    text: "Can I end my apartment lease early, and what would it cost me?",
    files: [ { name: "Lease 2025.pdf", pages: 14 }, { name: "Renewal letter 2026.pdf", pages: 2 }, { name: "House rules.docx", pages: 6 } ],
    limit: "5:00"
  },
  panels: [
    { id: "p1-one-speaker", title: "Mid-debate, one speaker", layout: "five", topBarLeft: "Council of 5",
      statusPill: "Round 2, 3:10 left, 2 of 5 agree",
      tableCentre: { round: "Round 2", timeLeft: "3:10 left", meter: { agree: 2, seats: 5, needed: 4 }, caption: "2 of 5 agree, needs 4" },
      speaking: ["Qwen"], voteMarks: null,
      bubbles: [
        { seat: "Qwen", text: "Tells Mistral the fee is one month at the new rent.", strength: 1 },
        { seat: "Gemma", text: "Cites the renewal letter, page 1: fee is one month.", strength: 1 },
        { seat: "Llama", text: "Holds that a letter cannot change the lease.", strength: 0.5 } ] },
    { id: "p2-all-speaking", title: "All five speaking at once (stress case; shown because the engine has not decided)", layout: "five", topBarLeft: "Council of 5",
      statusPill: "Round 2, 3:10 left, 2 of 5 agree",
      tableCentre: { round: "Round 2", timeLeft: "3:10 left", meter: { agree: 2, seats: 5, needed: 4 }, caption: "2 of 5 agree, needs 4" },
      speaking: ["Phi", "Llama", "Qwen", "Gemma", "Mistral"], voteMarks: null,
      bubbles: [
        { seat: "Phi", text: "Says the landlord never signed the letter.", strength: 1 },
        { seat: "Llama", text: "Holds that a letter cannot change the lease.", strength: 1 },
        { seat: "Qwen", text: "Tells Mistral the fee is one month at the new rent.", strength: 1 },
        { seat: "Gemma", text: "Cites the renewal letter, page 1: fee is one month.", strength: 1 },
        { seat: "Mistral", text: "Now agrees: one month, not two.", strength: 1 } ] },
    { id: "p3-seven-after-vote", title: "Seven seats, just after the round 1 vote", layout: "seven", topBarLeft: "Council of 7",
      statusPill: "Round 1 vote, 4 of 7 agree",
      tableCentre: { round: "Round 1 vote", timeLeft: "3:36 left", meter: { agree: 4, seats: 7, needed: 6 }, caption: "4 of 7 agree, needs 6" },
      speaking: [],
      voteMarks: { Phi: "cross", Llama: "cross", Granite: "check", Qwen: "check", Gemma: "check", Hermes: "cross", Mistral: "check" },
      bubbles: [ { seat: "Hermes", text: "Asks which rent the fee is based on.", strength: 0.5 } ] },
    { id: "p4-released", title: "The released answer in chat", layout: null, topBarLeft: "Council of 5",
      statusPill: "Agreed, 4 of 5",
      foldedCard: { heading: "Agreed 4 of 5", meta: "3 rounds, 3:40",
        seatMarks: { Phi: "cross", Llama: "check", Qwen: "check", Gemma: "check", Mistral: "check" },
        button: "See the debate" },
      answer: {
        paragraphs: [
          "Yes. You can end the lease early by giving 60 days' written notice and paying one month's rent at the new rate, $2,520.",
          "To be out by the end of February, send the notice by 30 December 2026. An email counts as written notice." ],
        citations: [ { file: "Renewal letter 2026.pdf", page: 1 }, { file: "Lease 2025.pdf", page: 9 }, { file: "House rules.docx", page: 4 } ],
        filesCitedLabel: "Files cited",
        dissent: "Phi disagreed: the renewal letter has one signature (page 2), so the old terms may still apply." },
      messageBoxPlaceholder: "Message the council" }
  ],
  wording: { switch: ["Table", "Chat"], stageButtons: ["Pause", "Stop"] }
};

/* How this look draws it. Builder's choices, not shared content. */
const DRAW = {
  nameSize: { 72: 19, 64: 17 },   /* one name size per council */
  nameFit: 0.78,                  /* name is fitted to this share of the head, by width axis */
  widthMin: 72, widthMax: 125,
  focusSeat: { "p3-seven-after-vote": "Granite" },
  /* where each bubble is pinned: c = centred on its head, l / r = left / right edge at this x */
  bubbleAt: {
    "p1-one-speaker": { Qwen: ["c"], Gemma: ["l", 628], Llama: ["r", 412] },
    "p2-all-speaking": { Qwen: ["c"], Gemma: ["l", 628], Llama: ["r", 412], Phi: ["r", 306], Mistral: ["l", 734] },
    "p3-seven-after-vote": { Hermes: ["l", 716] }   /* out to the right, away from Gemma; tail on Hermes */
  }
};

const n1 = v => Number(v.toFixed(1));
const check = s => `<svg width="${s}" height="${s}" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3.2 3.2L13 4.6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
let uid = 0;

function voteMark(kind, cx, cy, k) {
  /* k = 1 at the table (22 px badge), smaller in the line-up */
  const gap = `<circle class="v-gap" cx="${cx}" cy="${cy}" r="${n1(13 * k)}"/>`;
  if (kind === "check") {
    return `<g class="vote">${gap}<circle class="v-solid" cx="${cx}" cy="${cy}" r="${n1(11 * k)}"/>` +
      `<path class="v-check" stroke-width="${n1(Math.max(1.6, 2.4 * k))}" d="M${n1(cx - 4.8 * k)} ${n1(cy + 0.4 * k)}l${n1(3.3 * k)} ${n1(3.3 * k)}l${n1(6 * k)} ${n1(-7 * k)}"/></g>`;
  }
  const s = 3.7 * k;
  return `<g class="vote">${gap}<circle class="v-hollow" stroke-width="${n1(Math.max(1.5, 2 * k))}" cx="${cx}" cy="${cy}" r="${n1(10 * k)}"/>` +
    `<path class="v-cross" stroke-width="${n1(Math.max(1.5, 2.2 * k))}" d="M${n1(cx - s)} ${n1(cy - s)}L${n1(cx + s)} ${n1(cy + s)}M${n1(cx + s)} ${n1(cy - s)}L${n1(cx - s)} ${n1(cy + s)}"/></g>`;
}

function bodyCut(seat, x, yb, r, D) {
  const rr = r - 0.15 * D;
  switch (seat) {
    case 2: return `M${n1(x - r)} ${n1(yb - 0.36 * r)}H${n1(x + r)}`;                                             /* band */
    case 3: return `M${n1(x - 0.78 * r)} ${n1(yb - r)}L${n1(x)} ${n1(yb - 0.4 * r)}L${n1(x + 0.78 * r)} ${n1(yb - r)}`; /* collar */
    case 4: return `M${n1(x - 0.9 * r)} ${n1(yb - r)}L${n1(x + 0.5 * r)} ${n1(yb)}`;                               /* sash */
    case 5: return `M${n1(x)} ${n1(yb - r)}V${n1(yb)}`;                                                           /* placket */
    case 6: return `M${n1(x - rr)} ${n1(yb)}A${n1(rr)} ${n1(rr)} 0 0 1 ${n1(x + rr)} ${n1(yb)}`;                   /* yoke */
    case 7: return `M${n1(x - 0.36 * r)} ${n1(yb - r)}V${n1(yb)}M${n1(x + 0.36 * r)} ${n1(yb - r)}V${n1(yb)}`;      /* braces */
    default: return "";                                                                                          /* plain */
  }
}

/* One seated figure. Head = circle D. Body = half circle 1.4 D wide, 0.7 D tall, 2 px under the head. */
function figure(s, D, o) {
  const r = 0.7 * D, hr = D / 2;
  let x = s.x, yb = s.bodyBottomY, lift = 0;
  if (o.speaking) {                       /* the speaking lean: 4 px toward the table, head 2 px up */
    const dx = C.stage.centreX - x, dy = C.stage.flatEdgeY - yb, d = Math.hypot(dx, dy);
    x += 4 * dx / d; yb += 4 * dy / d; lift = 2;
  }
  const hy = yb - r - 2 - hr - lift;
  const id = "clip" + (++uid);
  const body = `M${n1(x - r)} ${n1(yb)}A${n1(r)} ${n1(r)} 0 0 1 ${n1(x + r)} ${n1(yb)}Z`;
  const cut = bodyCut(s.seat, x, yb, r, D);
  const size = DRAW.nameSize[D];
  const ringOut = o.speaking ? 7 : 0;
  const bx = n1(x + hr * 0.707), by = n1(hy - hr * 0.707);
  const top = Math.min(hy - hr - ringOut, o.vote ? by - 13 : Infinity);
  const label = `${s.name}, seat ${s.seat}` + (o.speaking ? ", speaking" : "") + (o.vote ? (o.vote === "check" ? ", agrees" : ", disagrees") : "");
  const svg =
    `<g class="fig s${s.seat}${o.focus ? " show-focus" : ""}" tabindex="0" role="button" aria-label="${label}">` +
    `<clipPath id="${id}"><path d="${body}"/></clipPath>` +
    `<path class="body" d="${body}"/>` +
    (cut ? `<path class="cut" clip-path="url(#${id})" stroke-width="${n1(D / 15)}" d="${cut}"/>` : "") +
    (o.speaking ? `<circle class="gap" cx="${n1(x)}" cy="${n1(hy)}" r="${n1(hr + 9)}"/><circle class="ring" cx="${n1(x)}" cy="${n1(hy)}" r="${n1(hr + 5.5)}"/>` : "") +
    `<circle class="head" cx="${n1(x)}" cy="${n1(hy)}" r="${hr}"/>` +
    `<text class="nm" x="${n1(x)}" y="${n1(hy + 0.35 * size)}" font-size="${size}" data-fit="${n1(DRAW.nameFit * D)}">${s.name}</text>` +
    (o.vote ? voteMark(o.vote, bx, by, 1) : "") +
    `<rect class="focus" x="${n1(x - r - 6)}" y="${n1(top - 6)}" width="${n1(2 * r + 12)}" height="${n1(yb - top + 12)}" rx="8"/>` +
    `</g>`;
  const boxes = [
    { seat: s.name, l: x - hr - ringOut, t: hy - hr - ringOut, r: x + hr + ringOut, b: hy + hr + ringOut },
    { seat: s.name, l: x - r, t: yb - r, r: x + r, b: yb }
  ];
  if (o.vote) boxes.push({ seat: s.name, l: bx - 13, t: by - 13, r: bx + 13, b: by + 13 });
  return { svg, boxes, headX: x, top };
}

/* Small figure, no name inside: top bar (head 14) and line-up (head 22). */
function mini(seat, D, vote) {
  const hr = D / 2, r = 0.7 * D, gap = D < 20 ? 1 : 2, pad = vote ? 5 : 0;
  const w = n1(2 * r + (vote ? 4 : 0.4)), h = n1(D + gap + r + pad), cx = w / 2, hy = pad + hr, yb = pad + D + gap + r;
  return `<svg class="mini s${seat}" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true">` +
    `<g class="fig"><path class="body" d="M${n1(cx - r)} ${n1(yb)}A${n1(r)} ${n1(r)} 0 0 1 ${n1(cx + r)} ${n1(yb)}Z"/>` +
    `<circle class="head" cx="${n1(cx)}" cy="${n1(hy)}" r="${hr}"/></g>` +
    (vote ? voteMark(vote, n1(cx + hr * 0.707), n1(hy - hr * 0.707), 0.62) : "") + `</svg>`;
}

function tableCentre(tc, R) {
  const cx = C.stage.centreX, cy = C.stage.flatEdgeY - 0.4 * R, m = tc.meter;
  const total = m.seats * 12 + (m.seats - 1) * 8 + 10;
  let px = cx - total / 2, pips = "";
  for (let i = 1; i <= m.seats; i++) {
    pips += i <= m.agree
      ? `<circle class="pip-on" cx="${n1(px + 6)}" cy="${n1(cy + 4)}" r="6"/>`
      : `<circle class="pip-off" cx="${n1(px + 6)}" cy="${n1(cy + 4)}" r="5.25"/>`;
    px += 12 + 8;
    if (i === m.needed) { pips += `<rect class="pip-bar" x="${n1(px)}" y="${n1(cy - 4)}" width="2" height="16"/>`; px += 10; }
  }
  return `<text class="tc tc-round" x="${cx}" y="${n1(cy - 20)}">${tc.round}<tspan class="time" dx="14">${tc.timeLeft}</tspan></text>` +
    `<g role="img" aria-label="${tc.caption}">${pips}</g>` +
    `<text class="tc tc-cap" x="${cx}" y="${n1(cy + 34)}">${tc.caption}</text>`;
}

function question() {
  const q = C.question;
  return `<div class="ask"><p class="q">${q.text}</p><div class="chips">` +
    q.files.map(f => `<span class="chip">${f.name}<span class="more">, ${f.pages} pages</span></span>`).join("") +
    `</div><p class="meta num">Time limit ${q.limit}</p></div>`;
}

function tableView(p) {
  const L = C.layouts[p.layout], D = L.headDiameter, R = L.tableRadius, cx = C.stage.centreX, fy = C.stage.flatEdgeY;
  const figs = L.seats.map(s => figure(s, D, {
    speaking: p.speaking.includes(s.name),
    vote: p.voteMarks ? p.voteMarks[s.name] : null,
    focus: DRAW.focusSeat[p.id] === s.name
  }));
  const boxes = figs.flatMap(f => f.boxes);
  /* Machine check: no body touches the table. Nearest point of a body's flat bottom to the table centre. */
  figs.forEach(f => {
    const b = f.boxes[1], d = Math.hypot(Math.min(Math.max(cx, b.l), b.r) - cx, b.b - fy);
    if (d < R + 2) console.error(`${p.id}: body of ${b.seat} touches the table (${n1(d - R)} px)`);
  });
  const bubbles = p.bubbles.map(b => {
    const i = L.seats.findIndex(s => s.name === b.seat), f = figs[i], at = DRAW.bubbleAt[p.id][b.seat];
    const bottom = n1(C.stage.height - (f.top - C.bubble.gapAboveHead));
    let pos, cls = "";
    if (at[0] === "c") pos = `left:${n1(f.headX)}px;transform:translateX(-50%);--tail:50%`;
    else if (at[0] === "l") pos = `left:${at[1]}px;--tail:${n1(f.headX - at[1])}px`;
    else { pos = `right:${n1(C.stage.width - at[1])}px;--tail:${n1(at[1] - f.headX)}px`; cls = " from-right"; }
    return `<div class="bubble${cls}${b.strength < 1 ? " is-fading" : ""}" data-seat="${b.seat}" role="note" aria-label="${b.seat}: ${b.text}" style="bottom:${bottom}px;${pos};--bw:${L.bubbleMaxWidth}px"><span>${b.text}</span></div>`;
  }).join("");
  const arc = `M${cx - R} ${fy}A${R} ${R} 0 0 1 ${cx + R} ${fy}`;
  return `<div class="col">${question()}</div>` +
    `<div class="stage" data-boxes='${JSON.stringify(boxes.map(b => ({ seat: b.seat, l: n1(b.l), t: n1(b.t), r: n1(b.r), b: n1(b.b) })))}'>` +
    `<svg width="1040" height="558" viewBox="0 0 1040 558" role="group" aria-label="Council table">` +
    figs.map(f => f.svg).join("") +
    `<path class="cloth" d="${arc}Z"/><path class="cloth-edge" d="${arc}Z"/>` + tableCentre(p.tableCentre, R) +
    `</svg>${bubbles}</div>` +
    `<div class="dock"><div class="left">${C.wording.stageButtons.map(b => `<button type="button" class="btn">${b}</button>`).join("")}</div>` +
    messageBox(C.frame.messageBoxPlaceholder, "Add to next round") +
    `<div class="switch" role="group" aria-label="View"><button type="button" aria-pressed="true">${C.wording.switch[0]}</button><button type="button" aria-pressed="false">${C.wording.switch[1]}</button></div></div>`;
}

function messageBox(placeholder, button) {
  return `<div class="msg"><input type="text" placeholder="${placeholder}" aria-label="${placeholder}"><button type="button" class="btn btn-ink">${button}</button></div>`;
}

function released(p) {
  const f = p.foldedCard, a = p.answer, seats = C.layouts.five.seats;
  return `<div class="col">${question()}` +
    `<section class="folded" aria-label="${f.heading}"><div class="folded-top"><div><h3>${check(18)}${f.heading}</h3><p class="meta num">${f.meta}</p></div>` +
    `<button type="button" class="btn">${f.button}</button></div>` +
    `<ul class="lineup">${seats.map(s => `<li aria-label="${s.name}, ${f.seatMarks[s.name] === "check" ? "agreed" : "disagreed"}">${mini(s.seat, 22, f.seatMarks[s.name])}${s.name}</li>`).join("")}</ul></section>` +
    `<div class="answer">${a.paragraphs.map(t => `<p>${t}</p>`).join("")}` +
    `<div class="chips cited"><span class="meta">${a.filesCitedLabel}</span>${a.citations.map(c => `<span class="chip">${c.file}<span class="more">, page ${c.page}</span></span>`).join("")}</div>` +
    `<p class="dissent">${a.dissent}</p></div></div>` +
    `<div class="dock">${messageBox(p.messageBoxPlaceholder, "Ask")}</div>`;
}

function pill(p) {
  const parts = p.statusPill.split(", ");
  return `<div class="pill num" role="status">` + parts.map(t =>
    t === "Agreed" ? `<span class="is-agreed">${check(14)}${t}</span>` : `<span>${t}</span>`).join("") + `</div>`;
}

function windowHTML(p) {
  const seats = C.layouts[p.layout || "five"].seats, sf = C.frame.sidebarFooter;
  return `<div class="window">` +
    `<div class="topbar"><div class="tb-title">${p.topBarLeft}</div>` +
    `<div class="seated" role="list" aria-label="Seated">${seats.map(s => `<span class="seatname" role="listitem">${mini(s.seat, 14)}${s.name}</span>`).join("")}</div>${pill(p)}</div>` +
    `<nav class="sidebar" aria-label="Main">` +
    C.frame.sidebarItems.map((t, i) => `<button type="button" class="side-item"${i === 0 ? ' aria-current="page"' : ""}>${t}</button>`).join("") +
    `<div class="side-foot"><button type="button" class="side-item" data-flip-theme aria-label="Theme">${sf[0]}<span class="val"><span class="when-light">Light</span><span class="when-dark">Dark</span></span></button>` +
    `<button type="button" class="side-item">${sf[1]}</button><p class="side-note">${sf[2]}</p></div></nav>` +
    `<div class="conv">${p.layout ? tableView(p) : released(p)}</div></div>`;
}

document.getElementById("panels").innerHTML = C.panels.map((p, i) =>
  `<section id="${p.id}"><p class="cap"><span>${p.title}</span>` +
  (i === 0 ? `<button type="button" class="btn btn-small" id="play">Play one bubble</button>` : "") +
  `</p>${windowHTML(p)}</section>`).join("");

/* ---------- theme ---------- */
const root = document.documentElement;
function showTheme() {
  document.querySelectorAll("[data-set-theme]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.setTheme === root.dataset.theme)));
}
document.addEventListener("click", e => {
  const set = e.target.closest("[data-set-theme]"), flip = e.target.closest("[data-flip-theme]");
  if (set) root.dataset.theme = set.dataset.setTheme;
  if (flip) root.dataset.theme = root.dataset.theme === "dark" ? "light" : "dark";
  if (set || flip) showTheme();
});
showTheme();

/* ---------- Play: one bubble, panel 1 ---------- */
const playBubble = document.querySelector('#p1-one-speaker .bubble[data-seat="Qwen"]');
document.getElementById("play").addEventListener("click", () => {
  playBubble.classList.remove("playing"); void playBubble.offsetWidth; playBubble.classList.add("playing");
});
playBubble.addEventListener("animationend", () => playBubble.classList.remove("playing"));

/* ---------- measured in the browser, after the font is in ---------- */
function fitNames() {
  const seen = {};
  document.querySelectorAll("text[data-fit]").forEach(t => {
    const target = Number(t.dataset.fit);
    const len = w => { t.style.fontStretch = w + "%"; return t.getComputedTextLength(); };
    const natural = len(100);
    let w = DRAW.widthMax;
    if (len(w) > target) {
      let lo = DRAW.widthMin, hi = DRAW.widthMax;
      for (let i = 0; i < 9; i++) { const mid = (lo + hi) / 2; if (len(mid) <= target) lo = mid; else hi = mid; }
      w = Math.floor(lo);
    }
    const got = len(w);
    if (got > target + 0.5) console.error(`Name too long for its head: ${t.textContent} needs under ${DRAW.widthMin}% width`);
    seen[`${t.textContent}@${t.getAttribute("font-size")}`] = { target, at100: n1(natural), width: w, drawn: n1(got) };
  });
  return seen;
}
function wrapBubbles() {
  document.querySelectorAll(".bubble").forEach(b => {
    b.style.width = "";
    const range = document.createRange(); range.selectNodeContents(b.firstChild);
    const widest = Math.max(...[...range.getClientRects()].map(r => r.width));
    b.style.width = Math.ceil(widest) + 27 + "px";
  });
}
/* Machine check of fixed item 7: no bubble touches another bubble or a figure. */
function checkBubbles() {
  const hit = (a, b, g) => a.l < b.r + g && b.l < a.r + g && a.t < b.b + g && b.t < a.b + g;
  const report = [];
  document.querySelectorAll(".stage").forEach(st => {
    const o = st.getBoundingClientRect(), id = st.closest("section").id;
    const bubs = [...st.querySelectorAll(".bubble")].map(b => {
      const r = b.getBoundingClientRect();
      return { seat: b.dataset.seat, l: r.left - o.left, t: r.top - o.top, r: r.right - o.left, b: r.bottom - o.top, lines: Math.round((r.height - 22) / 18) };
    });
    const figs = JSON.parse(st.dataset.boxes);
    bubs.forEach((a, i) => {
      if (a.lines > 2) console.error(`${id}: bubble of ${a.seat} has ${a.lines} lines`);
      if (a.l < 0 || a.r > 1040 || a.t < 0) console.error(`${id}: bubble of ${a.seat} leaves the stage`);
      bubs.slice(i + 1).forEach(b => { if (hit(a, b, 4)) console.error(`${id}: bubbles of ${a.seat} and ${b.seat} touch`); });
      figs.forEach(f => { if (f.seat !== a.seat && hit(a, f, 4)) console.error(`${id}: bubble of ${a.seat} touches figure ${f.seat}`); });
      report.push(`${id} ${a.seat} x ${Math.round(a.l)}-${Math.round(a.r)} y ${Math.round(a.t)}-${Math.round(a.b)} lines ${a.lines}`);
    });
  });
  return report;
}
function settle() {
  const names = fitNames(); wrapBubbles(); const bubbles = checkBubbles();
  if (location.hash === "#measure") document.title = JSON.stringify({ names, bubbles });
}
document.fonts.load("650 20px 'Archivo Variable'").then(() => document.fonts.ready).then(settle);
</script>
</body>

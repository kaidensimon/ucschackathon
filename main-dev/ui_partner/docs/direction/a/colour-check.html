<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>colour-check</title>
<style>
body{font:13px/18px ui-monospace,Menlo,monospace;margin:16px;background:#fff;color:#111}
pre{white-space:pre-wrap;margin:0}
.sw{display:inline-block;width:56px;height:56px;border-radius:50%;margin:4px;text-align:center;line-height:56px;font:650 12px/56px sans-serif}
.row{padding:12px;margin:8px 0}
</style>
</head>
<body>
<pre id="o"></pre>
<div id="s"></div>
<script>
// Working page for look A. Recomputes seat colours (L*, contrast, colour-vision distance).
// Machado 2009 matrices, severity 1.0, applied in linear RGB. Distance = OKLab x100.
const hex2rgb = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16) / 255);
const lin = (c) => (c <= 0.04045 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4);
const gam = (c) => (c <= 0.0031308 ? 12.92 * c : 1.055 * c ** (1 / 2.4) - 0.055);
const Y = (h) => { const [r, g, b] = hex2rgb(h).map(lin); return 0.2126 * r + 0.7152 * g + 0.0722 * b; };
const Lstar = (h) => { const y = Y(h); return y > 0.008856 ? 116 * Math.cbrt(y) - 16 : 903.3 * y; };
const cr = (a, b) => { const x = Y(a), y = Y(b); return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05); };
function oklab([r, g, b]) {
  const l = Math.cbrt(0.4122214708 * r + 0.5363325363 * g + 0.0514459929 * b);
  const m = Math.cbrt(0.2119034982 * r + 0.6806995451 * g + 0.1073969566 * b);
  const s = Math.cbrt(0.0883024619 * r + 0.2817188376 * g + 0.6299787005 * b);
  return [0.2104542553 * l + 0.793617785 * m - 0.0040720468 * s, 1.9779984951 * l - 2.428592205 * m + 0.4505937099 * s, 0.0259040371 * l + 0.7827717662 * m - 0.808675766 * s];
}
function oklab2lin([L, a, b]) {
  const l = (L + 0.3963377774 * a + 0.2158037573 * b) ** 3;
  const m = (L - 0.1055613458 * a - 0.0638541728 * b) ** 3;
  const s = (L - 0.0894841775 * a - 1.291485548 * b) ** 3;
  return [4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s, -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s, -0.0041960863 * l - 0.7034186147 * m + 1.707614701 * s];
}
const M = {
  normal: [[1, 0, 0], [0, 1, 0], [0, 0, 1]],
  protan: [[0.152286, 1.052583, -0.204868], [0.114503, 0.786281, 0.099216], [-0.003882, -0.048116, 1.051998]],
  deutan: [[0.367322, 0.860646, -0.227968], [0.280085, 0.672501, 0.047413], [-0.01182, 0.04294, 0.968881]],
  tritan: [[1.255528, -0.076749, -0.178779], [-0.078411, 0.930809, 0.147602], [0.004733, 0.691367, 0.3039]],
};
const K = Object.keys(M);
const cache = new Map();
const sims = (h) => { let v = cache.get(h); if (!v) { const c = hex2rgb(h).map(lin); v = K.map((k) => oklab(M[k].map((r) => Math.min(1, Math.max(0, r[0] * c[0] + r[1] * c[1] + r[2] * c[2]))))); cache.set(h, v); } return v; };
const dk = (a, b, i) => { const p = sims(a)[i], q = sims(b)[i]; return 100 * Math.hypot(p[0] - q[0], p[1] - q[1], p[2] - q[2]); };
const dmin = (a, b) => Math.min(dk(a, b, 0), dk(a, b, 1), dk(a, b, 2), dk(a, b, 3));
const lch = (h) => { const [L, a, b] = oklab(hex2rgb(h).map(lin)); return [L, Math.hypot(a, b), (Math.atan2(b, a) * 180 / Math.PI + 360) % 360]; };
const toHex = (rgbLin) => "#" + rgbLin.map((c) => Math.round(255 * gam(Math.min(1, Math.max(0, c)))).toString(16).padStart(2, "0")).join("").toUpperCase();
const inGamut = (v) => v.every((c) => c >= -0.0005 && c <= 1.0005);
// hex with CIE L* = target, OKLCH hue h, chroma C; null when outside sRGB
function make(target, C, hdeg) {
  const hr = hdeg * Math.PI / 180;
  let lo = 0, hi = 1;
  for (let i = 0; i < 30; i++) { const mid = (lo + hi) / 2; const v = oklab2lin([mid, C * Math.cos(hr), C * Math.sin(hr)]); const y = 0.2126 * v[0] + 0.7152 * v[1] + 0.0722 * v[2]; const ls = y > 0.008856 ? 116 * Math.cbrt(y) - 16 : 903.3 * y; if (ls < target) lo = mid; else hi = mid; }
  const v = oklab2lin([lo, C * Math.cos(hr), C * Math.sin(hr)]);
  return inGamut(v) ? toHex(v) : null;
}
const out = [];
const say = (s) => out.push(s);
const f = (n, d = 2) => n.toFixed(d);
const names = ["1 Olive", "2 Navy", "3 Oxblood", "4 Violet", "5 Petrol", "6 Mauve", "7 Slate"];
const T = {
  light: { page: "#E9ECE8", surface: "#F9FAF7", ink: "#1D2427", letter: "#F9FAF7", walnut: "#4A3628", rim: "#B58A55", lamp: "#F4B740", agreed: "#2A6A43", error: "#A52A1A", muted: "#55605C" },
  dark: { page: "#1C201F", surface: "#262B29", ink: "#E9ECE7", letter: "#1C201F", walnut: "#5A4130", rim: "#C49C66", lamp: "#F6C356", agreed: "#8CCB9C", error: "#FF8B73", muted: "#A5AEA9" },
};
function minPair(seats, i, n) {
  let best = [1e9, ""];
  for (let a = 0; a < n; a++) for (let b = a + 1; b < n; b++) { const d = dk(seats[a], seats[b], i); if (d < best[0]) best = [d, `${a + 1}-${b + 1}`]; }
  return best;
}
const worst = (seats, n) => Math.min(...K.map((_, i) => minPair(seats, i, n)[0]));
function report(label, theme, seats, brief) {
  const t = T[theme];
  say(`== ${label} [${theme}] ${seats.join(" ")}`);
  for (const n of [7, 5]) say(`  min seat-seat (${n} seats): ` + K.map((k, i) => { const [d, p] = minPair(seats, i, n); return `${k} ${f(d, 1)} (${p})`; }).join(", "));
  seats.forEach((s, i) => {
    if (brief && !brief.includes(i)) return;
    const [L, C, h] = lch(s);
    const others = ["ink", "walnut", "error", "agreed", "lamp"].map((o) => `${o} ${f(dk(s, t[o], 0), 1)}`).join(" ");
    say(`  ${names[i].padEnd(10)} ${s} L*${f(Lstar(s), 1)} okL ${f(L, 3)} C ${f(C, 3)} h ${f(h, 0)}  name ${f(cr(t.letter, s))}  page ${f(cr(s, t.page))}  ink ${f(cr(s, t.ink))}  walnut ${f(cr(s, t.walnut))}  normal-vision dist: ${others}`);
  });
}
const baseL = ["#4A4A04", "#1E3572", "#580D03", "#685DA3", "#005366", "#8A616C", "#262E3A"];
const baseD = ["#859D52", "#AEC9FD", "#E7B2BB", "#A8A1EB", "#24A5AB", "#CC7B8D", "#D3D7E1"];
report("as written", "light", baseL);
report("as written", "dark", baseD);
say(`walnut L* ${f(Lstar(T.light.walnut), 1)}, ink L* ${f(Lstar(T.light.ink), 1)}, page L* ${f(Lstar(T.light.page), 1)}`);

const t = T.light;
function grid(L0, L1, C0, C1, h0, h1, ok) {
  const set = new Set();
  for (let L = L0; L <= L1 + 1e-9; L += 1) for (let C = C0; C <= C1 + 1e-9; C += 0.01) for (let h = h0; h <= h1 + 1e-9; h += 4) { const x = make(L, C, h); if (x && ok(x)) set.add(x); }
  return [...set];
}
const basic = (x) => cr(t.letter, x) >= 5 && cr(x, t.page) >= 3 && dk(x, t.error, 0) >= 10 && dk(x, t.agreed, 0) >= 10 && dk(x, t.lamp, 0) >= 14;
const notInk = (x) => dk(x, t.ink, 0) >= 12 && cr(x, t.ink) >= 1.5;

// A: slate only. Other six as written.
{
  const fixed = baseL.slice(0, 6);
  const c = grid(20, 48, 0.01, 0.09, 200, 300, (x) => basic(x) && notInk(x)).map((x) => ({ x, s: Math.min(...fixed.map((o) => dmin(x, o))) })).sort((a, b) => b.s - a.s);
  say(`A: ${c.length} slate candidates. best:`);
  const seen = [];
  for (const k of c) { if (seen.length >= 4) break; if (seen.some((p) => dk(p, k.x, 0) < 4)) continue; seen.push(k.x); report(`A slate only, score ${f(k.s, 1)}`, "light", [...fixed, k.x], [6]); }
  window.A = seen;
}
// B: oxblood, navy, slate all lifted to about L* 30 (27 to 33); slate may go to 40.
{
  const fixed = [baseL[0], baseL[3], baseL[4], baseL[5]];
  const top = (arr, n) => arr.map((x) => ({ x, s: Math.min(...fixed.map((o) => dmin(x, o))) })).sort((a, b) => b.s - a.s).slice(0, n);
  // kept in character: navy stays blue, oxblood stays brown-red, slate stays blue-grey
  const navy = top(grid(27, 31, 0.10, 0.15, 258, 268, basic), 60);
  const ox = top(grid(26, 30, 0.08, 0.12, 14, 32, basic), 60);
  const slate = [{ x: "#485D7E", s: Math.min(...fixed.map((o) => dmin("#485D7E", o))) }];
  say(`B: candidates navy ${navy.length} (best ${f(navy[0].s, 1)}), oxblood ${ox.length} (best ${f(ox[0].s, 1)}), slate ${slate.length} (best ${f(slate[0].s, 1)})`);
  const res = [];
  for (const n of navy) for (const o of ox) { const no = dmin(n.x, o.x); if (no < 4) continue; for (const s of slate) { const sc = Math.min(n.s, o.s, s.s, no, dmin(n.x, s.x), dmin(o.x, s.x)); res.push({ sc, seats: [baseL[0], n.x, o.x, baseL[3], baseL[4], baseL[5], s.x] }); } }
  res.sort((a, b) => b.sc - a.sc || worst(b.seats, 5) - worst(a.seats, 5));
  const seen = [];
  for (const r of res) { if (seen.length >= 4) break; if (seen.some((p) => [1, 2, 6].every((i) => dk(p[i], r.seats[i], 0) < 3))) continue; seen.push(r.seats); report(`B lifted, score ${f(r.sc, 1)}`, "light", r.seats, [1, 2, 6]); }
  window.B = seen;
}
// C: the trade. How far can oxblood and navy lift before they merge with olive (L* 30) and petrol (L* 32)?
{
  const slate = "#485D7E";
  say("C: trade table. rows oxblood L*, cols navy L*. cell = worst of 5 seats / worst of 7 seats (all four kinds of vision)");
  const navyL = [23.8, 25, 26, 27, 28, 30];
  const oxL = [17.3, 20, 22, 24, 26, 28, 30];
  for (const [oh, oc] of [[32, 0.109], [24, 0.10], [16, 0.09]]) {
    say(` oxblood hue ${oh} chroma ${oc}; navy hue 265 chroma 0.115. navy L*: ${navyL.join("  ")}`);
    for (const ol of oxL) {
      const o = ol === 17.3 && oh === 32 ? baseL[2] : make(ol, oc, oh);
      if (!o) { say(`  ox L*${ol}: outside sRGB`); continue; }
      say(`  ox ${o} L*${ol} (error ${f(dk(o, t.error, 0), 1)}, walnut ${f(dk(o, t.walnut, 0), 1)}): ` + navyL.map((nl) => { const nv = nl === 23.8 ? baseL[1] : make(nl, 0.115, 265); const seats = [baseL[0], nv, o, baseL[3], baseL[4], baseL[5], slate]; return `${nv} ${f(worst(seats, 5), 1)}/${f(worst(seats, 7), 1)}`; }).join("  "));
    }
  }
}
// D: the sets shown in the study and its two comparison variants
{
  const S = "#485D7E";
  say("D: named sets");
  report("STUDY: as written, slate moved", "light", [...baseL.slice(0, 6), S]);
  report("VARIANT seats27 (navy and oxblood lifted to L* 26 to 27)", "light", [baseL[0], "#283D75", "#642C33", baseL[3], baseL[4], baseL[5], S], [1, 2]);
  report("VARIANT seats30 (navy and oxblood lifted to L* 30)", "light", [baseL[0], "#294385", "#723339", baseL[3], baseL[4], baseL[5], S], [1, 2]);
  report("oxblood only lifted to L* 30, navy as written", "light", [baseL[0], baseL[1], "#723339", baseL[3], baseL[4], baseL[5], S], [2]);
  report("oxblood only lifted to L* 22, navy as written", "light", [baseL[0], baseL[1], "#5D2027", baseL[3], baseL[4], baseL[5], S], [2]);
  say(`dark slate #D3D7E1 against dark ink #E9ECE7: ${f(cr("#D3D7E1", "#E9ECE7"))}:1, distance ${f(dk("#D3D7E1", "#E9ECE7", 0), 1)}`);
}
document.getElementById("o").textContent = out.join("\n");
document.title = out.join(" ;; ");
const s = document.getElementById("s");
const row = (seats, th) => { const d = document.createElement("div"); d.className = "row"; d.style.background = th.page; seats.forEach((c, i) => { const e = document.createElement("span"); e.className = "sw"; e.style.background = c; e.style.color = th.letter; e.textContent = names[i].split(" ")[1]; d.appendChild(e); }); const w = document.createElement("span"); w.className = "sw"; w.style.background = th.walnut; w.style.color = "#F5EFE6"; w.textContent = "walnut"; d.appendChild(w); const k = document.createElement("span"); k.className = "sw"; k.style.background = th.ink; k.style.color = th.page; k.textContent = "ink"; d.appendChild(k); s.appendChild(d); };
row(baseL, T.light);
for (const x of window.A) row([...baseL.slice(0, 6), x], T.light);
for (const x of window.B) row(x, T.light);
row(baseD, T.dark);
</script>
</body>
</html>

<script>
(() => {
  const C = JSON.parse(document.getElementById("study-content").textContent);
  const CX = C.stage.centreX;
  const FY = C.stage.flatEdgeY;
  const n = (v) => Math.round(v * 100) / 100;
  const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");

  // Where the study places each bubble. Words and strength come from the content above.
  // side "c" = centred on its seat, "l:x" = left edge at x, "r:x" = right edge at x (pushed away from a neighbour).
  const PLACE = {
    "p1-one-speaker": { Qwen: "c", Gemma: "l:592", Llama: "r:448" },
    "p2-all-speaking": { Phi: "r:307", Llama: "r:448", Qwen: "c", Gemma: "l:592", Mistral: "l:733" },
    "p3-seven-after-vote": { Hermes: "l:716" }, // pushed right, away from Gemma's head; tail stays over Hermes
  };
  // Panel 1 only: the one bubble the Play button fades in and out.
  const PLAY = { panel: "p1-one-speaker", seat: "Phi", text: "Says the landlord never signed the letter.", side: "r:307" };
  const FOCUSED = { panel: "p3-seven-after-vote", seat: "Granite" };

  function geom(seat, D) {
    const r = D / 2;
    const bh = 0.7 * D;
    const hy = seat.bodyBottomY - bh - 2 - r;
    return { x: seat.x, bb: seat.bodyBottomY, r, bh, hy, top: hy - r };
  }

  function voteMark(kind, mx, my, k) {
    // k scales the 20 px mark; 1 on the table, smaller in the folded card
    const key = `<circle class="vm-key" cx="${n(mx)}" cy="${n(my)}" r="${n(12 * k)}"/>`;
    if (kind === "check") {
      return `${key}<circle class="vm-check-disc" cx="${n(mx)}" cy="${n(my)}" r="${n(10 * k)}"/>` +
        `<path class="vm-check" d="M${n(mx - 4.6 * k)} ${n(my + 0.4 * k)}l${n(3.2 * k)} ${n(3.2 * k)}l${n(6 * k)} ${n(-7 * k)}"/>`;
    }
    return `${key}<circle class="vm-cross-disc" cx="${n(mx)}" cy="${n(my)}" r="${n(10 * k - 1)}"/>` +
      `<path class="vm-cross" d="M${n(mx - 3.6 * k)} ${n(my - 3.6 * k)}l${n(7.2 * k)} ${n(7.2 * k)}M${n(mx + 3.6 * k)} ${n(my - 3.6 * k)}l${n(-7.2 * k)} ${n(7.2 * k)}"/>`;
  }

  function stage(panel) {
    const L = C.layouts[panel.layout];
    const D = L.headDiameter;
    const R = L.tableRadius;
    const N = L.seats.length;
    const speaking = new Set(panel.speaking);
    const lampR = R - 30;
    const poolR = (0.8 * 2 * lampR * Math.sin(Math.PI / (2 * N))) / 2; // 0.8 x distance to the next lamp
    const nameSize = D >= 70 ? 15 : 13;
    const numSize = D >= 70 ? 14 : 13;
    const boxes = [];
    const half = `M${CX - R} ${FY}A${R} ${R} 0 0 1 ${CX + R} ${FY}Z`;
    let s = `<svg class="stage-svg" width="${C.stage.width}" height="${C.stage.height}" viewBox="0 0 ${C.stage.width} ${C.stage.height}">`;
    s += `<clipPath id="clip-${panel.id}"><path d="${half}"/></clipPath>`;
    s += `<path class="tabletop" d="${half}"/>`;
    s += `<path class="tablerim" d="M${CX - R + 1.5} ${FY}A${R - 1.5} ${R - 1.5} 0 0 1 ${CX + R - 1.5} ${FY}"/>`;
    // lamps: one per seat, 30 px inside the rim on the seat's own angle
    let pools = "";
    let lamps = "";
    for (const seat of L.seats) {
      const a = (seat.angleDeg * Math.PI) / 180;
      const lx = n(CX - lampR * Math.cos(a));
      const ly = n(FY - lampR * Math.sin(a));
      if (speaking.has(seat.name)) {
        pools += `<circle cx="${lx}" cy="${ly}" r="${n(poolR)}" fill="url(#pool)"/>`;
        lamps += `<circle class="lamp-lit" cx="${lx}" cy="${ly}" r="6"/>`;
      } else {
        lamps += `<circle class="lamp-quiet" cx="${lx}" cy="${ly}" r="4.25"/>`;
      }
    }
    s += `<g clip-path="url(#clip-${panel.id})">${pools}</g>${lamps}`;
    // middle of the table
    const t = panel.tableCentre;
    const m = t.meter;
    const pitch = 20;
    const extra = 10; // room for the notch
    const width = (m.seats - 1) * pitch + extra;
    let mx = CX - width / 2;
    let meter = "";
    for (let i = 0; i < m.seats; i++) {
      meter += i < m.agree ? `<circle class="m-solid" cx="${n(mx)}" cy="${FY - 59}" r="6"/>` : `<circle class="m-hollow" cx="${n(mx)}" cy="${FY - 59}" r="5.25"/>`;
      if (i === m.needed - 1) {
        meter += `<rect class="m-notch" x="${n(mx + pitch / 2 + extra / 2 - 1)}" y="${FY - 69}" width="2" height="20"/>`;
        mx += extra;
      }
      mx += pitch;
    }
    s += `<text class="t-round" x="${CX}" y="${FY - 112}">${esc(t.round)}</text>`;
    s += `<text class="t-time" x="${CX}" y="${FY - 84}">${esc(t.timeLeft)}</text>`;
    s += `<g aria-hidden="true">${meter}</g>`;
    s += `<text class="t-caption" x="${CX}" y="${FY - 33}">${esc(t.caption)}</text>`;
    // 8 px of page colour between every body and the table. The table radius gives it; nothing is cut out of the walnut.
    // A body's nearest point to the table is on its flat bottom edge.
    for (const seat of L.seats) {
      const g = geom(seat, D);
      const nearX = Math.min(Math.max(CX, g.x - g.bh), g.x + g.bh);
      const clear = Math.hypot(nearX - CX, FY - g.bb) - R;
      if (clear < 8) console.error(`table gap: ${panel.id} ${seat.name}: body ${n(clear)} px from the table, needs 8`);
    }
    // figures
    for (const seat of L.seats) {
      const g = geom(seat, D);
      const isSpeaking = speaking.has(seat.name);
      const vote = panel.voteMarks ? panel.voteMarks[seat.name] : null;
      const focused = FOCUSED.panel === panel.id && FOCUSED.seat === seat.name;
      const label = `Seat ${seat.seat}, ${seat.name}` + (isSpeaking ? ", speaking" : "") + (vote ? (vote === "check" ? ", agrees" : ", disagrees") : "");
      s += `<g class="fig seat-${seat.seat}${focused ? " is-focused" : ""}" tabindex="0" role="button" aria-label="${esc(label)}">`;
      const fx = g.x - g.bh;
      const fw = 2 * g.bh;
      const fh = g.bb - g.top;
      s += `<rect class="focus-lamp" x="${n(fx - 9)}" y="${n(g.top - 9)}" width="${n(fw + 18)}" height="${n(fh + 18)}" rx="11"/>`;
      s += `<rect class="focus-ink" x="${n(fx - 7)}" y="${n(g.top - 7)}" width="${n(fw + 14)}" height="${n(fh + 14)}" rx="9"/>`;
      s += `<path class="body" d="M${n(fx)} ${g.bb}A${n(g.bh)} ${n(g.bh)} 0 0 1 ${n(fx + fw)} ${g.bb}Z"/>`;
      if (isSpeaking) {
        s += `<circle class="ring-gap" cx="${g.x}" cy="${n(g.hy)}" r="${g.r + 8}"/><circle class="ring" cx="${g.x}" cy="${n(g.hy)}" r="${g.r + 4.5}"/>`;
      }
      s += `<circle class="head" cx="${g.x}" cy="${n(g.hy)}" r="${g.r}"/>`;
      s += `<text class="name" x="${g.x}" y="${n(g.hy)}" dy=".35em" font-size="${nameSize}">${esc(seat.name)}</text>`;
      s += `<text class="num" x="${g.x}" y="${n(g.bb - g.bh * 0.3)}" dy=".35em" font-size="${numSize}">${seat.seat}</text>`;
      boxes.push({ seat: seat.name, x0: g.x - g.bh, y0: g.bb - g.bh, x1: g.x + g.bh, y1: g.bb });
      const hr = g.r + (isSpeaking ? 6 : 0);
      boxes.push({ seat: seat.name, x0: g.x - hr, y0: g.hy - hr, x1: g.x + hr, y1: g.hy + hr });
      if (vote) {
        // on the outer upper side of the head, away from the neighbour seat
        const side = g.x < CX ? -1 : 1;
        const vx = g.x + side * g.r * 0.7071;
        const vy = g.hy - g.r * 0.7071;
        s += voteMark(vote, vx, vy, 1);
        boxes.push({ seat: seat.name, x0: vx - 12, y0: vy - 12, x1: vx + 12, y1: vy + 12 });
      }
      s += `</g>`;
    }
    s += `</svg>`;
    // bubbles
    const gapAbove = C.bubble.gapAboveHead;
    const byName = Object.fromEntries(L.seats.map((x) => [x.name, x]));
    const list = panel.bubbles.map((b) => ({ ...b, side: PLACE[panel.id][b.seat] }));
    if (PLAY.panel === panel.id) list.push({ seat: PLAY.seat, text: PLAY.text, side: PLAY.side, play: true });
    for (const b of list) {
      const g = geom(byName[b.seat], D);
      const bottom = g.top - (speaking.has(b.seat) ? 6 : 0) - gapAbove; // 12 px above the head, or above its speaking ring
      s += `<div class="bubble${b.play ? " bubble-play" : ""}" data-seat="${esc(b.seat)}" data-x="${g.x}" data-bottom="${n(bottom)}" data-side="${b.side}" data-max="${L.bubbleMaxWidth}"` +
        (b.play ? ` aria-hidden="true"` : "") + (b.strength !== undefined && b.strength !== 1 ? ` style="--strength:${b.strength}"` : "") +
        `><span><span class="vh">${esc(b.seat)}: </span>${esc(b.text)}</span></div>`;
    }
    return { html: s, boxes };
  }

  function frame(panel, inner) {
    const L = C.layouts[panel.layout || "five"];
    const live = panel.layout !== null;
    const seated = L.seats.map((x) => `<li><i class="seat-${x.seat}" style="background:var(--seat)"></i>${esc(x.name)}</li>`).join("");
    const pill = live
      ? `<div class="pill"><span class="pill-dot"></span>${esc(panel.statusPill)}</div>`
      : `<div class="pill pill-agreed"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M2.5 7.4l3 3 6-7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>${esc(panel.statusPill)}</div>`;
    const [newChat, ...items] = C.frame.sidebarItems;
    const [f1, f2, note] = C.frame.sidebarFooter;
    return `<div class="window">
      <div class="topbar"><div class="appname">${esc(panel.topBarLeft)}</div><ul class="seated" aria-label="Seated">${seated}</ul>${pill}</div>
      <nav class="sidebar" aria-label="Main">
        <button class="btn-main" type="button">${esc(newChat)}</button>
        <ul class="nav">${items.map((x) => `<li><button type="button">${esc(x)}</button></li>`).join("")}</ul>
        <div class="sidefoot"><button type="button">${esc(f1)}</button><button type="button">${esc(f2)}</button><p class="sidenote">${esc(note)}</p></div>
      </nav>
      <div class="conv">${inner}</div>
    </div>`;
  }

  function ask() {
    const q = C.question;
    return `<div class="ask"><p class="ask-who">You</p><p class="ask-text">${esc(q.text)}</p>
      <ul class="files">${q.files.map((f) => `<li class="chip">${esc(f.name)}, ${f.pages} pages</li>`).join("")}<li class="meta">Time limit ${esc(q.limit)}</li></ul></div>`;
  }

  function debate(panel) {
    const st = stage(panel);
    const [pause, stop] = C.wording.stageButtons;
    const [table, chat] = C.wording.switch;
    const inner = `${ask()}
      <div class="stage" data-boxes='${JSON.stringify(st.boxes.map((b) => ({ seat: b.seat, x0: n(b.x0), y0: n(b.y0), x1: n(b.x1), y1: n(b.y1) })))}'>${st.html}
        <div class="msg"><input type="text" aria-label="${esc(C.frame.messageBoxPlaceholder)}" placeholder="${esc(C.frame.messageBoxPlaceholder)}"></div>
      </div>
      <div class="stagefoot">
        <div class="stagefoot-left"><button class="btn" type="button">${esc(pause)}</button><button class="btn" type="button">${esc(stop)}</button></div>
        <div class="switch" role="group" aria-label="View"><button class="seg" type="button" aria-pressed="true">${esc(table)}</button><button class="seg" type="button" aria-pressed="false">${esc(chat)}</button></div>
      </div>`;
    return frame(panel, inner);
  }

  function miniHead(seat, kind) {
    return `<svg width="38" height="34" viewBox="0 0 38 34" class="seat-${seat.seat}" aria-hidden="true"><circle class="mini-head" cx="14" cy="20" r="13"/>${voteMark(kind, 23.2, 10.8, 0.8)}</svg>`;
  }

  function released(panel) {
    const f = panel.foldedCard;
    const a = panel.answer;
    const seats = C.layouts.five.seats;
    const phi = seats.find((x) => a.dissent.startsWith(x.name));
    const inner = `<div class="thread">${ask()}
      <section class="folded" aria-label="The debate, folded">
        <div class="folded-top">
          <div>
            <h3 class="folded-heading"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><circle class="agreed-disc" cx="10" cy="10" r="10"/><path class="agreed-check" d="M5.4 10.4l3.2 3.2l6 -7"/></svg>${esc(f.heading)}</h3>
            <p class="meta folded-meta">${esc(f.meta)}</p>
          </div>
          <button class="btn" type="button">${esc(f.button)}</button>
        </div>
        <ul class="marks">${seats.map((x) => `<li>${miniHead(x, f.seatMarks[x.name])}${esc(x.name)}<span class="vh">${f.seatMarks[x.name] === "check" ? " agreed" : " disagreed"}</span></li>`).join("")}</ul>
      </section>
      <div class="answer">
        ${a.paragraphs.map((p) => `<p>${esc(p)}</p>`).join("")}
        <div class="cited"><span class="meta">${esc(a.filesCitedLabel)}</span>${a.citations.map((c) => `<span class="chip">${esc(c.file)}, p. ${c.page}</span>`).join("")}</div>
        <div class="dissent">${miniHead(phi, "cross")}<span>${esc(a.dissent)}</span></div>
      </div>
    </div>
    <div class="msg"><input type="text" aria-label="${esc(panel.messageBoxPlaceholder)}" placeholder="${esc(panel.messageBoxPlaceholder)}"></div>`;
    return frame(panel, inner);
  }

  document.getElementById("panels").innerHTML = C.panels.map((p) => {
    const play = PLAY.panel === p.id ? `<button class="btn btn-small" type="button" id="play">Play one bubble</button>` : "";
    return `<section class="panel" id="${p.id}"><div class="panel-caption"><h2>${esc(p.title)}</h2>${play}</div>${p.layout ? debate(p) : released(p)}</section>`;
  }).join("");

  // ---- bubble layout pass: shrink to the text, place, rise above a neighbour, then check ----
  function layout() {
    const problems = [];
    for (const st of document.querySelectorAll(".stage")) {
      const boxes = JSON.parse(st.dataset.boxes);
      const els = [...st.querySelectorAll(".bubble")].sort((a, b) => (a.dataset.side === "c") - (b.dataset.side === "c"));
      const placed = [];
      for (const el of els) {
        const max = Number(el.dataset.max);
        el.style.width = `${max}px`;
        el.style.width = "max-content";
        const natural = Math.ceil(el.getBoundingClientRect().width) + 1;
        if (natural <= 232) {
          // short enough for one line
          el.style.width = `${natural}px`;
        } else {
          // two lines, as narrow as the words allow, so both lines are about the same length
          let lo = 96;
          let hi = max;
          while (hi - lo > 1) {
            const mid = (lo + hi) >> 1;
            el.style.width = `${mid}px`;
            if (el.offsetHeight <= 54 && el.firstChild.scrollHeight <= 36) hi = mid; else lo = mid;
          }
          el.style.width = `${hi}px`;
        }
        const w = el.offsetWidth;
        const h = el.offsetHeight;
        const sx = Number(el.dataset.x);
        const [mode, val] = el.dataset.side.split(":");
        const left = mode === "c" ? Math.round(sx - w / 2) : mode === "l" ? Number(val) : Number(val) - w;
        let bottom = Number(el.dataset.bottom);
        for (const p of placed) {
          if (p.play || el.classList.contains("bubble-play")) continue;
          if (left < p.x1 + 8 && left + w > p.x0 - 8 && bottom > p.y0 - 8 && bottom - h < p.y1 + 8) bottom = Math.min(bottom, p.y0 - 8);
        }
        el.style.left = `${left}px`;
        el.style.top = `${bottom - h}px`;
        el.style.setProperty("--tail", `${sx - left}px`);
        const box = { seat: el.dataset.seat, x0: left, y0: bottom - h, x1: left + w, y1: bottom, play: el.classList.contains("bubble-play") };
        const where = `${st.parentNode.parentNode.parentNode.id} ${box.seat}`;
        if (h > 54 || el.firstChild.scrollHeight > 36) problems.push(`${where}: more than 2 lines`);
        if (sx - left < 12 || left + w - sx < 12) problems.push(`${where}: tail off the bubble`);
        if (box.x0 < 0 || box.y0 < 0 || box.x1 > 1040) problems.push(`${where}: outside the stage`);
        for (const o of placed) if (box.x0 < o.x1 && box.x1 > o.x0 && box.y0 < o.y1 && box.y1 > o.y0) problems.push(`${where}: overlaps the ${o.seat} bubble`);
        // 4 px clear of every figure (head, body, speaking ring, vote mark)
        for (const o of boxes) if (box.x0 < o.x1 + 4 && box.x1 > o.x0 - 4 && box.y0 < o.y1 + 4 && box.y1 > o.y0 - 4) problems.push(`${where}: less than 4 px from ${o.seat}`);
        placed.push(box);
      }
      // the message box stays 8 px under the table's flat edge
      const msg = st.querySelector(".msg");
      if (msg.offsetTop < FY + 8) problems.push(`${st.parentNode.parentNode.parentNode.id}: message box ${msg.offsetTop - FY} px under the table, needs 8`);
    }
    for (const p of problems) console.error(`bubble layout: ${p}`);
  }
  layout();
  document.fonts.ready.then(layout);

  // ---- theme switch ----
  const root = document.documentElement;
  const variant = location.hash.match(/seats(\d+)/);
  if (variant) root.dataset.seats = variant[1];
  const themeButtons = [...document.querySelectorAll("[data-set-theme]")];
  const sync = () => { for (const b of themeButtons) b.setAttribute("aria-pressed", String(b.dataset.setTheme === (root.dataset.theme || "light"))); };
  for (const b of themeButtons) b.addEventListener("click", () => { root.dataset.theme = b.dataset.setTheme; });
  new MutationObserver(sync).observe(root, { attributes: true, attributeFilter: ["data-theme"] });
  sync();

  // ---- Play: one bubble fades in 250 ms, stays, fades out 1.5 s ----
  const play = document.getElementById("play");
  const playBubble = document.querySelector(".bubble-play");
  let busy = false;
  play.addEventListener("click", () => {
    if (busy) return;
    busy = true;
    playBubble.classList.add("is-shown");
    setTimeout(() => { playBubble.classList.remove("is-shown"); }, 250 + 3000);
    setTimeout(() => { busy = false; }, 250 + 3000 + 1500);
  });
})();
</script>
</body>
</html>
